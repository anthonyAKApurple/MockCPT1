<!DOCTYPE html>
<!-- This code was provided as starter code by my teacher. -->
<html>
 
<head>
   <!-- The head section contains general information about the webpage. -->
   <title>Outfit Color Matcher</title>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
   
   <style>
       /* Simple CSS styling */
       body { font-family: sans-serif; max-width: 420px; margin: 20px auto; padding: 10px; background-color: #f9f9f9; }
       .box { border: 1px solid #ccc; background-color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
       input[type="text"], select { width: 100%; padding: 8px; margin: 5px 0 10px; box-sizing: border-box; font-size: 14px; }
       .swatch { height: 42px; margin: 5px 0 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; border-radius: 4px; text-shadow: 1px 1px 2px black; font-family: monospace; }
       footer { text-align: center; font-size: 12px; color: #666; }
   </style>
</head>




<body>
   <!-- The body section contains the webpage content -->
   <header>
       <h2 style="text-align: center;">Outfit Color Matcher</h2>
   </header>


   <div x-data="webApp">
       
       <!-- 1. INPUT CONTROLS SECTION -->
       <div class="box">
           <h3>1. Preferences</h3>


           <!-- User types in HEX code -->
           <label>Top HEX Code:</label>
           <input type="text" x-model="topHex" placeholder="#3B82F6">


           <!-- Link to find HEX codes -->
           <p style="font-size: 12px; margin-top: -5px;">Find HEX codes at <a href="https://imagecolorpicker.com" target="_blank">imagecolorpicker.com</a></p>


           <!-- Style Dropdown -->
           <label>Style Context:</label>
           <select x-model="style">
               <option value="Casual">Casual</option>
               <option value="Formal">Formal</option>
           </select>


           <!-- Dark Pants Checkbox -->
           <label>
               <input type="checkbox" x-model="darkPants"> Dark Pants Only
           </label>
       </div>


       <!-- 2. COLOR SWATCH DISPLAY SECTION -->
       <div class="box">
           <h3>2. Matched Palette</h3>


           <!-- Top Swatch -->
           Top Color (<span x-text="validTopHex"></span>):
           <div class="swatch" :style="'background-color:' + validTopHex" x-text="validTopHex"></div>


           <!-- Pants Swatch -->
           Pants Color (<span x-text="pantsHex"></span>):
           <div class="swatch" :style="'background-color:' + pantsHex" x-text="pantsHex"></div>


           <!-- Shoes Swatch -->
           Shoes Color (<span x-text="shoesHex"></span>):
           <div class="swatch" :style="'background-color:' + shoesHex" x-text="shoesHex"></div>


           <!-- Accent Swatch -->
           Accent Color (<span x-text="accentHex"></span>):
           <div class="swatch" :style="'background-color:' + accentHex" x-text="accentHex"></div>
       </div>


   </div>
 
   <!-- Footer section from starter template -->
   <footer>
       <p>© 2026-2027<br>
       AP Computer Science Principles<br>
       George Washington High School</p>
   </footer>
 
   <script>
       // JavaScript Alpine logic
       document.addEventListener('alpine:init', () => {
           Alpine.data('webApp', () => ({
               // --- 1. STATE VARIABLES ---
               topHex: '#3B82F6', // Default user top color
               style: 'Casual',   // Default style context
               darkPants: false,  // Checkbox state


               // --- 2. HELPER FUNCTIONS ---
               
               // Converts HEX (#RRGGBB) to HSL object {h, s, l}
               hexToHsl(hex) {
                   let r = parseInt(hex.substring(1, 3), 16) / 255;
                   let g = parseInt(hex.substring(3, 5), 16) / 255;
                   let b = parseInt(hex.substring(5, 7), 16) / 255;
                   let max = Math.max(r, g, b), min = Math.min(r, g, b);
                   let h = 0, s = 0, l = (max + min) / 2;


                   if (max !== min) {
                       let d = max - min;
                       s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                       if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
                       else if (max === g) h = (b - r) / d + 2;
                       else h = (r - g) / d + 4;
                       h /= 6;
                   }
                   return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
               },


               // Converts HSL numbers to HEX string (#RRGGBB)
               hslToHex(h, s, l) {
                   l /= 100;
                   let a = (s * Math.min(l, 1 - l)) / 100;
                   let f = n => {
                       let k = (n + h / 30) % 12;
                       let color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                       return Math.round(255 * color).toString(16).padStart(2, '0').toUpperCase();
                   };
                   return '#' + f(0) + f(8) + f(4);
               },


               // --- 3. COMPUTED LOGIC RULES ---


               // Ensures user input is a valid 6-digit hex code before using it
               get validTopHex() {
                   let hex = this.topHex.trim();
                   if (!hex.startsWith('#')) hex = '#' + hex;
                   return /^#[0-9A-Fa-f]{6}$/.test(hex) ? hex.toUpperCase() : '#3B82F6';
               },


               // Logic rule for Pants color selection
               get pantsHex() {
                   if (this.darkPants) return '#111111';          // Rule 1: Checkbox checked -> Dark Black
                   if (this.style === 'Formal') return '#1C1C1E'; // Rule 2: Formal style -> Charcoal
                   
                   // Rule 3: Casual style -> Khaki for dark tops, Navy for light tops
                   let hsl = this.hexToHsl(this.validTopHex);
                   return hsl.l < 30 ? '#D4A373' : '#1B263B';
               },


               // Logic rule for Shoes color selection
               get shoesHex() {
                   if (this.style === 'Formal') return '#1A1A1A';
                   
                   // Rule 2: Casual style -> White sneakers for light top, Brown for dark top
                   let hsl = this.hexToHsl(this.validTopHex);
                   return hsl.l > 60 ? '#F8F9FA' : '#5C3D2E';
               },


               // Logic rule for Accent color (complementary color opposite on color wheel)
               get accentHex() {
                   let hsl = this.hexToHsl(this.validTopHex);
                   let oppositeHue = (hsl.h + 180) % 360; // Shift hue by 180 degrees
                   return this.hslToHex(oppositeHue, 80, 50);
               }
           }));
       });
   </script>
</body>
</html>
