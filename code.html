<!DOCTYPE html>
<html>
<head>
   <title>Outfit Color Matcher</title>
   <!-- alpine js library -->
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
   <style>
       body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 10px; background: #f0f0f0; }
       .box { border: 2px solid #333; background: #fff; padding: 15px; margin-bottom: 15px; }
       input[type="text"], select { width: 100%; padding: 8px; margin: 5px 0 10px; box-sizing: border-box; border: 1px solid #333; }
       .swatch { height: 40px; margin: 5px 0 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; border: 1px solid #000; text-shadow: 1px 1px 2px black; }
       footer { text-align: center; font-size: 12px; color: #555; }
   </style>
</head>
<body>
   <!-- page header -->
   <header><h2 style="text-align: center;">Outfit Color Matcher</h2></header>
   <!-- main app controls and swatches -->
   <div x-data="webApp">
       <div class="box">
           <h3>1. Preferences</h3>
           <label>Top HEX Code:</label>
           <input type="text" x-model="topHex" placeholder="#3B82F6">
           <label>Style Context:</label>
           <select x-model="style">
               <option value="Casual">Casual</option>
               <option value="Formal">Formal</option>
           </select>
           <label><input type="checkbox" x-model="darkPants"> Dark Pants Only</label>
       </div>
       <div class="box">
           <h3>2. Matched Palette</h3>
           Top Color (<span x-text="validTopHex"></span>):
           <div class="swatch" :style="'background-color:' + validTopHex" x-text="validTopHex"></div>
           Pants Color (<span x-text="pantsHex"></span>):
           <div class="swatch" :style="'background-color:' + pantsHex" x-text="pantsHex"></div>
           Shoes Color (<span x-text="shoesHex"></span>):
           <div class="swatch" :style="'background-color:' + shoesHex" x-text="shoesHex"></div>
           Accent Color (<span x-text="accentHex"></span>):
           <div class="swatch" :style="'background-color:' + accentHex" x-text="accentHex"></div>
       </div>
   </div>

   <footer><p>© AP Computer Science Principles</p></footer>
   <script>
       document.addEventListener('alpine:init', () => {
           Alpine.data('webApp', () => ({
               // default values
               topHex: '#3B82F6', style: 'Casual', darkPants: false,
               // convert hex to hsl to check light vs dark
               hexToHsl(hex) {
                   let r = parseInt(hex.substring(1, 3), 16) / 255, g = parseInt(hex.substring(3, 5), 16) / 255, b = parseInt(hex.substring(5, 7), 16) / 255;
                   let max = Math.max(r, g, b), min = Math.min(r, g, b), h = 0, s = 0, l = (max + min) / 2;
                   if (max !== min) {
                       let d = max - min;
                       s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                       h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
                       h /= 6;
                   }
                   return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
               },
               // convert hsl back to hex
               hslToHex(h, s, l) {
                   l /= 100;
                   let a = (s * Math.min(l, 1 - l)) / 100, f = n => {
                       let k = (n + h / 30) % 12, color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                       return Math.round(255 * color).toString(16).padStart(2, '0').toUpperCase();
                   };
                   return '#' + f(0) + f(8) + f(4);
               },
               // make sure top hex is correct
               get validTopHex() {
                   let hex = this.topHex.trim();
                   if (!hex.startsWith('#')) hex = '#' + hex;
                   return /^#[0-9A-Fa-f]{6}$/.test(hex) ? hex.toUpperCase() : '#3B82F6';
               },
               // pick matching pants color
               get pantsHex() {
                   if (this.darkPants) return '#111111';
                   if (this.style === 'Formal') return '#1C1C1E';
                   return this.hexToHsl(this.validTopHex).l < 30 ? '#D4A373' : '#1B263B';
               },
               // pick matching shoes color
               get shoesHex() {
                   if (this.style === 'Formal') return '#1A1A1A';
                   return this.hexToHsl(this.validTopHex).l > 60 ? '#F8F9FA' : '#5C3D2E';
               },
               // pick opposite color on color wheel
               get accentHex() {
                   let hsl = this.hexToHsl(this.validTopHex);
                   return this.hslToHex((hsl.h + 180) % 360, 80, 50);
               }
           }));
       });
   </script>
</body>
</html>
